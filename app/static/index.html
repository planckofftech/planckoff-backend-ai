<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Door Schedule Extraction</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --fg: #14171f;
    --muted: #646b7a;
    --line: #e3e6ec;
    --accent: #2d5bd7;
    --accent-fg: #ffffff;
    --ok-bg: #eaf6ee;   --ok-fg: #1a6b39;
    --warn-bg: #fdf4e3; --warn-fg: #8a5a10;
    --err-bg: #fdecec;  --err-fg: #a32020;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --surface: #1c1f26; --fg: #e9ebf0; --muted: #9aa2b1;
      --line: #2c313b; --accent: #6f9bff; --accent-fg: #10131a;
      --ok-bg: #16281d;   --ok-fg: #7ddba0;
      --warn-bg: #2a2417; --warn-fg: #f0c069;
      --err-bg: #2b1719;  --err-fg: #f19a9a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px 64px;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 20px;
  }

  .pick { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  input[type=file] {
    flex: 1 1 320px; padding: 10px; font: inherit;
    border: 1px dashed var(--line); border-radius: 8px;
    background: var(--bg); color: var(--fg);
  }
  input[type=file]::file-selector-button {
    font: inherit; margin-right: 12px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--fg);
  }
  .filemeta { color: var(--muted); font-size: 13px; margin-top: 10px; }

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 550; padding: 10px 20px; cursor: pointer;
    border-radius: 8px; border: 1px solid transparent;
    background: var(--accent); color: var(--accent-fg);
  }
  button.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .spinner {
    width: 15px; height: 15px; border-radius: 50%; display: inline-block;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .working { color: var(--muted); font-size: 14px; }

  .toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }

  .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; }
  .msg.err  { background: var(--err-bg);  color: var(--err-fg); }
  .msg.warn { background: var(--warn-bg); color: var(--warn-fg); }

  .headline {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .count { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
    background: var(--ok-bg); color: var(--ok-fg);
  }
  .badge.ai { background: var(--warn-bg); color: var(--warn-fg); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

  .tablewrap {
    overflow-x: auto; border: 1px solid var(--line);
    border-radius: 8px; background: var(--surface);
  }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td {
    padding: 7px 12px; text-align: left; white-space: nowrap;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  th:last-child, td:last-child { border-right: 0; }
  tbody tr:last-child td { border-bottom: 0; }
  thead th {
    background: var(--bg); color: var(--muted); font-size: 11px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .04em;
    position: sticky; top: 0; z-index: 1;
    border-bottom: 2px solid var(--line);
  }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--bg) 55%, transparent); }
  tbody tr:hover td { background: var(--bg); }
  td.blank { color: transparent; }
  td.tag { font-weight: 650; }

  /* The drawing sits beside the rows, not a scroll away below 128 of them. */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px;
            align-items: start; }
  .layout.has-preview { grid-template-columns: minmax(0, 1fr) 420px; }
  @media (max-width: 1180px) {
    .layout.has-preview { grid-template-columns: minmax(0, 1fr); }
  }
  #pagepreview:empty { display: none; }
  #pagepreview { position: sticky; top: 16px; }

  figure { margin: 0; }
  figure img {
    width: 100%; height: auto; display: block; cursor: zoom-in;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  }
  figcaption { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .maxwrap { max-height: 78vh; overflow: auto; border-radius: 8px; }

  details.tech { margin-top: 26px; }
  details.tech > summary {
    cursor: pointer; color: var(--muted); font-size: 13px;
    padding: 6px 0; user-select: none;
  }
  details.tech > summary:hover { color: var(--fg); }
  .techbody {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 16px 18px; margin-top: 10px; background: var(--surface);
  }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input[type=text] {
    width: 100%; max-width: 380px; padding: 7px 10px; font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg);
  }
  pre {
    margin: 12px 0 0; padding: 12px; border-radius: 6px; overflow: auto;
    max-height: 320px; font-size: 12px; background: var(--bg);
    border: 1px solid var(--line);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Door Schedule Extraction</h1>
    <p>Upload a construction drawing set. The schedule is found and returned as a table.</p>
  </header>

  <div class="card">
    <div class="pick">
      <input type="file" id="file" accept="application/pdf,.pdf">
    </div>
    <div class="filemeta" id="filemeta"></div>

    <div class="actions">
      <button id="go">Extract schedule</button>
      <button id="preview" class="ghost">Show page</button>
      <button id="csv" class="ghost" style="display:none">Download CSV</button>
      <span class="working" id="working"></span>
      <span style="flex:1"></span>
      <label class="toggle">
        <input type="checkbox" id="allowAi" checked>
        Read scanned drawings with AI
      </label>
    </div>
  </div>

  <div id="msg"></div>

  <div class="layout" id="layout">
    <div id="result"></div>
    <aside id="pagepreview"></aside>
  </div>

  <details class="tech" id="tech" style="display:none">
    <summary>Technical details</summary>
    <div class="techbody" id="techbody"></div>
  </details>

  <details class="tech">
    <summary>Connection settings</summary>
    <div class="techbody">
      <div class="field">
        <label for="key">API key</label>
        <input type="text" id="key" value="dev-key">
      </div>
      <div class="field">
        <label for="base">API base URL — blank when served by the API itself</label>
        <input type="text" id="base" placeholder="(same origin)">
      </div>
      <div class="field">
        <label class="toggle"><input type="checkbox" id="debug"> Include per-page finder scores</label>
      </div>
    </div>
  </details>

</div>

<script>
const FIELDS = [
  ["door_tag", "Door"], ["from_space", "From"], ["to_space", "To"],
  ["door_width", "Width"], ["door_height", "Height"], ["door_type", "Type"],
  ["door_material", "Material"], ["door_finish", "Finish"],
  ["frame_material", "Frame material"], ["frame_finish", "Frame finish"],
  ["threshold", "Threshold"], ["fire_rating", "Fire rating"],
  ["hw_set", "Hardware set"], ["comments", "Comments"]
];

const $ = id => document.getElementById(id);
const defaultBase = location.protocol.startsWith("http") ? "" : "http://localhost:8010";
let lastResult = null;

const base = () => ($("base").value || defaultBase).replace(/\/$/, "");
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function clearOutput() {
  $("msg").innerHTML = "";
  $("result").innerHTML = "";
  $("pagepreview").innerHTML = "";
  $("layout").classList.remove("has-preview");
  $("tech").style.display = "none";
  $("csv").style.display = "none";
}

function busy(button, on, text) {
  button.disabled = on;
  $("preview").disabled = on;
  $("go").disabled = on;
  $("working").innerHTML = on ? '<span class="spinner"></span>' + esc(text) : "";
}

function fail(detail, status) {
  const prefix = status ? "" : "";
  $("msg").innerHTML = '<div class="msg err">' + prefix + esc(detail) + "</div>";
}

$("file").addEventListener("change", () => {
  clearOutput();
  const f = $("file").files[0];
  if (!f) { $("filemeta").textContent = ""; return; }
  const mb = f.size / 1048576;
  $("filemeta").textContent = f.name + " · " + mb.toFixed(1) + " MB" +
    (mb > 50 ? "  — larger than the 50 MB limit" : "");
});

$("go").addEventListener("click", async () => {
  const f = $("file").files[0];
  if (!f) { fail("Choose a PDF first."); return; }

  clearOutput();
  busy($("go"), true, "Reading the drawing set…");

  const params = new URLSearchParams({
    allow_ai: $("allowAi").checked ? "true" : "false",
    debug: $("debug").checked ? "true" : "false"
  });
  const body = new FormData();
  body.append("file", f);
  const t0 = performance.now();

  try {
    const res = await fetch(base() + "/api/v1/door-schedule/extract?" + params, {
      method: "POST", headers: { "X-API-Key": $("key").value }, body
    });
    const wall = Math.round(performance.now() - t0);
    const data = await res.json().catch(() => null);

    if (!res.ok) {
      fail((data && data.detail) || res.statusText, res.status);
      return;
    }
    lastResult = data;
    render(data, wall);
    if (data.rows.length) $("csv").style.display = "inline-block";
  } catch (err) {
    fail("Could not reach the service. " + err.message);
  } finally {
    busy($("go"), false);
  }
});

function render(d, wall) {
  const ai = d.method.startsWith("ai");
  const pages = (d.source_pages || []).join(", ");
  const secs = (d.duration_ms / 1000).toFixed(1);

  let html = '<div class="headline">' +
    '<span class="count">' + d.row_count + (d.row_count === 1 ? " door" : " doors") + "</span>" +
    '<span class="badge' + (ai ? " ai" : "") + '">' +
      (ai ? "Read by AI" : "Read exactly from the drawing") + "</span></div>";

  html += '<p class="sub">Found on page ' + esc(pages) + " of " + d.pages_scanned +
    " · " + secs + " seconds</p>";

  if (ai) {
    html += '<div class="msg warn">These rows were interpreted from an image ' +
      "because the drawing has no readable text layer. Check them against the " +
      "sheet before relying on them.</div>";
  }

  if (d.rows.length) {
    const cols = columnsFor(d);

    html += '<div class="tablewrap"><table><thead><tr>';
    for (const c of cols) html += "<th>" + esc(c.label) + "</th>";
    html += "</tr></thead><tbody>";

    for (const r of d.rows) {
      html += "<tr>";
      for (const c of cols) {
        const v = c.get(r);
        html += v
          ? '<td' + (c.key === "door_tag" ? ' class="tag"' : "") + ">" + esc(v) + "</td>"
          : '<td class="blank">.</td>';
      }
      html += "</tr>";
    }
    html += "</tbody></table></div>";

    const hidden = FIELDS.filter(([k]) => !d.rows.some(r => r[k]))
      .map(([, label]) => label);
    if (hidden.length) {
      html += '<p class="sub" style="margin-top:10px">Not on this drawing: ' +
        esc(hidden.join(", ")) + ".</p>";
    }
  }

  $("result").innerHTML = html;
  renderTech(d, wall);
}

// Backend's extra_key(): lowercase, runs of non-alphanumerics to underscores.
const slug = h => String(h).toLowerCase()
  .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");

function columnsFor(d) {
  // Only columns this drawing actually carries. A schedule with no FROM/TO
  // should not lead with two columns of dots while the room name sits out
  // past COMMENTS.
  const cols = FIELDS
    .filter(([key]) => d.rows.some(r => r[key]))
    .map(([key, label]) => ({ key, label, get: r => r[key] || "" }));

  const extras = [];
  for (const r of d.rows) {
    for (const k of Object.keys(r.extra || {})) {
      if (!extras.includes(k)) extras.push(k);
    }
  }

  // Sheet order, not discovery order -- a column that is blank on the first
  // rows would otherwise jump to the end, far from where it sits on the paper.
  const position = new Map();
  (d.headers || []).forEach((h, i) => {
    const s = slug(h);
    if (!position.has(s)) position.set(s, i);
  });
  extras.sort((a, b) =>
    (position.has(a) ? position.get(a) : 1e6) -
    (position.has(b) ? position.get(b) : 1e6));

  const nice = k => k.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  for (const k of extras) {
    cols.push({ key: k, label: nice(k), get: r => (r.extra || {})[k] || "" });
  }
  return cols;
}

function renderTech(d, wall) {
  let t = '<dl class="kv">' +
    "<dt>Method</dt><dd>" + esc(d.method) + "</dd>" +
    "<dt>Source pages</dt><dd>" + esc((d.source_pages || []).join(", ") || "—") + "</dd>" +
    "<dt>Pages scanned</dt><dd>" + d.pages_scanned + "</dd>" +
    "<dt>Server time</dt><dd>" + d.duration_ms + " ms</dd>" +
    "<dt>Round trip</dt><dd>" + wall + " ms</dd>" +
    "</dl>";

  if (d.headers && d.headers.length) {
    t += '<div class="field"><label>Column headers as printed on the sheet</label>' +
      "<div>" + esc(d.headers.join("  |  ")) + "</div></div>";
  }
  for (const w of d.warnings || []) {
    t += '<div class="msg warn" style="margin:12px 0 0">' + esc(w) + "</div>";
  }
  if (d.page_scores && d.page_scores.length) {
    t += '<div class="field"><label>Per-page finder scores</label>' +
      '<div class="tablewrap"><table><thead><tr><th>Page</th><th>Header hits</th>' +
      "<th>Tag run</th><th>Score</th><th>Passed</th></tr></thead><tbody>";
    for (const p of [...d.page_scores].sort((a, b) => b.score - a.score)) {
      if (!p.score) continue;
      t += "<tr><td>" + p.page + "</td><td>" + p.header_hits + "</td><td>" +
        p.tag_run + "</td><td>" + p.score + "</td><td>" + (p.passed ? "yes" : "") +
        "</td></tr>";
    }
    t += "</tbody></table></div></div>";
  }
  t += "<pre>" + esc(JSON.stringify(d, null, 2)) + "</pre>";

  $("techbody").innerHTML = t;
  $("tech").style.display = "block";
}

$("preview").addEventListener("click", async () => {
  const f = $("file").files[0];
  if (!f) { fail("Choose a PDF first."); return; }

  $("pagepreview").innerHTML = "";
  $("layout").classList.remove("has-preview");
  busy($("preview"), true, "Rendering the page…");

  const body = new FormData();
  body.append("file", f);

  try {
    const res = await fetch(base() + "/api/v1/door-schedule/preview", {
      method: "POST", headers: { "X-API-Key": $("key").value }, body
    });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail; } catch (e) { /* not JSON */ }
      fail(detail, res.status);
      return;
    }
    const page = res.headers.get("X-Source-Page") || "?";
    const located = res.headers.get("X-Table-Located") !== "false";
    const url = URL.createObjectURL(await res.blob());
    $("pagepreview").innerHTML =
      '<figure><div class="maxwrap"><a href="' + url + '" target="_blank" ' +
      'rel="noopener"><img src="' + url + '" alt="Page ' + esc(page) + '"></a></div>' +
      "<figcaption>" + (located
        ? "Page " + esc(page) + " — the schedule is outlined in red. Click to enlarge."
        : "Page " + esc(page) + " — this is the page that was read. No outline " +
          "is shown because its layout could not be measured.") +
      "</figcaption></figure>";
    $("layout").classList.add("has-preview");
  } catch (err) {
    fail("Could not reach the service. " + err.message);
  } finally {
    busy($("preview"), false);
  }
});

$("csv").addEventListener("click", () => {
  if (!lastResult) return;
  // Same columns, same order as the table on screen.
  const cols = columnsFor(lastResult);
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const lines = [cols.map(c => q(c.label)).join(",")];
  for (const r of lastResult.rows) {
    lines.push(cols.map(c => q(c.get(r))).join(","));
  }
  const url = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/csv" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "door-schedule.csv";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
